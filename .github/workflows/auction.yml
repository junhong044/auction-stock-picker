name: A股竞价选股 · 每交易日自动运行

on:
  schedule:
    # GitHub Actions 免费版 cron 高峰期常延迟数十分钟甚至更久。
    # 错峰三点触发 + push_from_results 当日去重,确保准点附近至少成功推送一次。
    # 北京时间 = UTC+8。竞价数据 9:25 出,故最早 9:26 才有效:
    - cron: '26 1 * * 1-5'   # 9:26 主触发
    - cron: '35 1 * * 1-5'   # 9:35 备份(若主触发延迟/失败)
    - cron: '50 1 * * 1-5'   # 9:50 兜底
  workflow_dispatch:  # 支持手动点击运行

permissions:
  contents: write

concurrency:
  group: auction-picker
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行竞价选股 v3(情绪开关+稳健评分+Top3)
        env:
          OUTPUT_DIR: ${{ github.workspace }}/results
        run: |
          mkdir -p "$OUTPUT_DIR"
          python auction_top3_v3.py --source eastmoney --no-chart

      - name: 归档结果到 results 目录
        run: |
          # 滚动保留:竞价CSV只留最近10个,防止仓库无限膨胀
          ls -t results/竞价Top3结果_*.csv 2>/dev/null | tail -n +11 | xargs -r rm -f
          ls -t results/竞价选股结果_*.csv 2>/dev/null | tail -n +11 | xargs -r rm -f
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 竞价选股v3结果 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "无新增结果,跳过提交"
          fi

      - name: 微信推送结果(情绪+双区Top3,带重试+去重)
        if: always()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          OUTPUT_DIR: ${{ github.workspace }}/results
        run: |
          python push_from_results.py auction_v3 || echo "推送失败,不影响归档"

      - name: 持久化推送标记(供错峰触发去重)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results/.push_done_* 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 推送标记 $(date -u +'%Y%m%d-%H%M')" || true
            git push || true
          fi

      - name: 上传运行产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 竞价选股v3结果-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
